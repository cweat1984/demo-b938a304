<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./arrowline-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Southern Command" />
    <title>Southern Command · Southern Lifting & Hoisting</title>
    <script>
      // Runs before the module graph. Another site's frame never gets storage (Chrome denies it) or the app.
      (function () {
        if (window.top === window.self) return
        try { if (window.parent.location.origin === location.origin) return } catch (e) { /* foreign */ }
        var open = location.origin + location.pathname
        document.documentElement.innerHTML = '<head><meta charset="utf-8"><title>Southern Command</title></head><body><div style="font:16px system-ui;padding:40px;text-align:center;color:#ddd;background:#0b0d10;min-height:100vh">This app can’t be shown inside another site. <a style="color:#7cc4ff" target="_top" rel="noopener" href="' + open + '">Open it in its own tab</a>.</div></body>'
        window.stop()
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
